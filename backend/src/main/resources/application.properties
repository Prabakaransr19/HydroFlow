# Application
spring.application.name=water-management
server.port=8080

# PostgreSQL Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/water_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
#
#spring.security.user.name=admin
#spring.security.user.password=admin

#JWT Dependencies

jwt.secret=${JWT_SECRET:change-this-dev-jwt-secret-to-a-32-plus-char-value}
jwt.expiration=${JWT_EXPIRATION_MS:900000}

# Jackson Serialization
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.write-dates-as-timestamps=false

# Razorpay test mode. Set RAZORPAY_KEY_ID and RAZORPAY_KEY_SECRET in the backend environment.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Mail SMTP Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors-origins=http://localhost:5173